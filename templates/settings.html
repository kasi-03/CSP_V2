<!DOCTYPE html>

<html>

<head>

    <title>Settings</title>

    <style>

        body{

            font-family: Arial, sans-serif;

            background:#f5f5f5;

            margin:0;

            padding:40px;

        }

        .container{

            width:95%;

            max-width:1400px;

            margin:40px auto;

            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0px 0px 10px rgba(0,0,0,.2);

            box-sizing:border-box;

        }

        h1{

            text-align:center;

        }

        .nav-buttons{

            margin:20px 0;

        }

        .btn{

            display:inline-block;

            background:black;

            color:white;

            text-decoration:none;

            padding:12px 20px;

            border-radius:5px;

            margin-right:10px;

            font-size:15px;

            font-weight:bold;

            transition:.2s;

        }

        .btn:hover{

            opacity:.9;

        }

        label{

            display:block;

            margin-top:18px;

            font-weight:bold;

        }

        input{

            width:100%;

            padding:12px;

            margin-top:8px;

            box-sizing:border-box;

            font-size:16px;

        }

        button{

            margin-top:25px;

            padding:12px 20px;

            background:black;

            color:white;

            border:none;

            border-radius:5px;

            font-size:15px;

            cursor:pointer;

        }
    </style>

</head>

<body>

    <div class="container">

    <h1>

        AI Police Complaint Drafting System

    </h1>

    <hr>

    <div class="nav-buttons">

        <a class="btn" href="/">
            Dashboard
        </a>

        <a class="btn" href="/record">
            Record Complaint
        </a>

    </div>

    <hr>

    <h2>

        Police Station Settings

    </h2>

    <form action="/save_settings" method="POST">

        <label>Police Station Name</label>

        <input
            type="text"
            name="station_name" 
            value="{{ station.station_name }}"
            required
        >

        <label>Place</label>

        <input
            type="text"
            name="place"
            value="{{ station.place }}"
            required
        >

        <label>District</label>

        <input
            type="text"
            name="district"
            value="{{ station.district }}"
            required
        >

        <button type="submit">

            Save Settings

        </button>

    </form>

</div>

</body>

</html>
